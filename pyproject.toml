[project]
name = "ram-market-scraper"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "cloudscraper>=1.2.71",
    "pandas>=3.0.2",
    "prefect>=3.0",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "poethepoet>=0.46.0",
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.poe.tasks]
dev = { cmd = "uv run etl.py", envfile = ".env.development" }
prod = { cmd = "uv run etl.py", envfile = ".env.production" }
test = { cmd = "uv run pytest" }
prefect-server = { cmd = "uv run prefect server start" }
